name: iOS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build and Test (Xcode 26, iOS 26)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -scheme shelfapp \
            -project shelfapp.xcodeproj \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=26.2" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -scheme shelfapp \
            -project shelfapp.xcodeproj \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=26.2" \
            -only-testing:shelfappTests
